<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
:root {
  --bg:#ffffff;
  --text:#222222;
  --text-soft:#666666;
  --text-light:#999999;
  --border:#dddddd;
  --card-bg:#ffffff;
  --card-border:#eee;
  --btn-bg:#222;
  --btn-text:#fff;
  --btn-danger:#bb3333;
}
@media (prefers-color-scheme: dark){
  :root.theme-auto{
    --bg:#121212;
    --text:#eeeeee;
    --text-soft:#bbbbbb;
    --text-light:#777777;
    --border:#333333;
    --card-bg:#1e1e1e;
    --card-border:#333;
    --btn-bg:#383838;
    --btn-text:#fff;
  }
}
body.theme-dark{
  --bg:#121212;
  --text:#eeeeee;
  --text-soft:#bbbbbb;
  --text-light:#777777;
  --border:#333333;
  --card-bg:#1e1e1e;
  --card-border:#333;
  --btn-bg:#383838;
  --btn-text:#fff;
}
body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:var(--bg);
  color:var(--text);
  transition: background 0.3s, color 0.3s;
}
.container{
  width:92%;
  max-width:580px;
  text-align:center;
}
/*实时日期时间*/
.time-block{
  margin-bottom:24px;
}
.time-date{
  font-size:1.5rem;
  color:var(--text-soft);
  font-weight:300;
  letter-spacing:1px;
}
.time-ampm{
  font-size:1.2rem;
  color:var(--text-soft);
  font-weight:300;
  margin-top:4px;
}
h1{
  font-size:2.2rem;
  font-weight:400;
  text-align:center;
  margin-bottom:32px;
}
.search-wrap{
  display:flex;
  gap:8px;
}
#query{
  flex:1;
  padding:12px 18px;
  border:1px solid var(--border);
  border-radius:999px;
  outline:none;
  font-size:1rem;
  background:var(--bg);
  color:var(--text);
}
#query:focus{border-color:#555;}
button{
  padding:12px 22px;
  border:none;
  border-radius:999px;
  background:var(--btn-bg);
  color:var(--btn-text);
  cursor:pointer;
  font-size:1rem;
}
button:hover{opacity:0.85;}
.tip{
  text-align:center;
  margin-top:20px;
  font-size:0.9rem;
  color:var(--text-soft);
}
.tip a{color:var(--text);cursor:pointer;margin:0 4px;}

/*弹窗样式，模仿截图圆角卡片*/
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.45);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:99;
  padding:20px;
}
.modal.hidden{display:none;}
.modal-box{
  background:var(--card-bg);
  border-radius:20px;
  width:100%;
  max-width:520px;
  padding:28px;
  max-height:85vh;
  overflow-y:auto;
}
.modal-box h3{
  font-size:1.5rem;
  font-weight:500;
  margin-bottom:24px;
}
.engine-item{
  margin-bottom:18px;
}
.engine-main{
  display:flex;
  align-items:flex-start;
  gap:12px;
  cursor:pointer;
}
.engine-main input[type="radio"]{
  margin-top:3px;
  width:19px;
  height:19px;
  accent-color:var(--text);
  flex-shrink:0;
}
.engine-name{
  font-size:1.1rem;
}
.engine-desc{
  color:var(--text-soft);
  margin-top:4px;
  padding-left:31px;
  display:none;
}
.engine-desc.show{display:block;}
.engine-edit-area{
  padding-left:31px;
  margin-top:8px;
  display:none;
  gap:6px;
  flex-direction:column;
}
.engine-edit-area.show{display:flex;}
.engine-edit-area input{
  padding:7px 9px;
  border:1px solid var(--border);
  border-radius:7px;
  font-size:0.9rem;
  background:var(--bg);
  color:var(--text);
}

/*底部按钮*/
.modal-footer{
  display:flex;
  justify-content:flex-end;
  margin-top:30px;
}
.add-btn-wrap{
  margin-top:24px;
  padding-top:16px;
  border-top:1px solid var(--card-border);
}
.add-btn-wrap button{
  background:#555;
  font-size:0.9rem;
  padding:8px 16px;
}
.del-btn{
  margin-left:31px;
  margin-top:8px;
  background:var(--btn-danger);
  padding:6px 12px;
  font-size:0.85rem;
}
/*页脚*/
.footer-text{
  position:fixed;
  bottom:24px;
  left:0;
  width:100%;
  text-align:center;
  font-size:0.85rem;
  color:var(--text-light);
}
/*设置弹窗样式*/
.setting-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}
.setting-row label{
  font-size:1rem;
}
.setting-row select{
  padding:6px 10px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
}
</style>
</head>
<body class="theme-auto">
<div class="container">
  <!-- 实时日期时间 -->
  <div class="time-block">
    <div class="time-date" id="timeDate"></div>
    <div class="time-ampm" id="timeAmpm"></div>
  </div>
  <h1>Search</h1>
  <div class="search-wrap">
    <input id="query" type="text" placeholder="输入搜索词…">
    <button onclick="search()" data-i18n="searchBtn">搜索</button>
  </div>
  <div class="tip">
    <span data-i18n="currentEngine">当前引擎</span>：<span id="engineName"></span>
    &nbsp;<a onclick="showModal()" data-i18n="changeEngine">更改</a>
    &nbsp;<a onclick="openSettings()" data-i18n="settings">设置</a>
  </div>
</div>

<!-- 页脚文字 -->
<div class="footer-text" data-i18n="footer">本站点托管于GitHub Pages</div>

<!-- 搜索引擎弹窗 -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h3 data-i18n="selectEngine">请选择默认搜索引擎</h3>
    <div id="engineList"></div>
    <div class="add-btn-wrap">
      <button onclick="addBlankEngine()" data-i18n="addEngine">+ 添加自定义搜索引擎</button>
    </div>
    <div class="modal-footer">
      <button onclick="saveEngines()" data-i18n="ok">确定</button>
    </div>
  </div>
</div>

<!-- 设置弹窗（语言+主题） -->
<div id="settingModal" class="modal hidden">
  <div class="modal-box">
    <h3 data-i18n="siteSettings">网站设置</h3>
    <div class="setting-row">
      <label data-i18n="langLabel">语言</label>
      <select id="langSelect">
        <option value="auto" data-i18n="auto">跟随系统</option>
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
    </div>
    <div class="setting-row">
      <label data-i18n="themeLabel">主题</label>
      <select id="themeSelect">
        <option value="auto" data-i18n="auto">跟随系统</option>
        <option value="light" data-i18n="light">浅色</option>
        <option value="dark" data-i18n="dark">深色</option>
      </select>
    </div>
    <div class="modal-footer">
      <button onclick="saveSettings()" data-i18n="ok">确定</button>
    </div>
  </div>
</div>

<script>
// 双语文本库
const i18n = {
  zh:{
    searchBtn:"搜索",
    currentEngine:"当前引擎",
    changeEngine:"更改",
    settings:"设置",
    footer:"本站点托管于GitHub Pages",
    selectEngine:"请选择默认搜索引擎",
    addEngine:"+ 添加自定义搜索引擎",
    ok:"确定",
    siteSettings:"网站设置",
    langLabel:"语言",
    themeLabel:"主题",
    auto:"跟随系统",
    light:"浅色",
    dark:"深色",
    alertMinEngine:"至少保留一个搜索引擎！",
    searchPlaceholder:"输入搜索词…",
    engineDescBaidu:"国内广泛，中文资源丰富",
    engineDescBing:"界面简洁，英文/国际资讯有优势",
    engineDesc360:"依托安全技术，结果精准",
    engineDescSogou:"中文搜索佳，可搜微信文章"
  },
  en:{
    searchBtn:"Search",
    currentEngine:"Current engine",
    changeEngine:"Change",
    settings:"Settings",
    footer:"Hosted on GitHub Pages",
    selectEngine:"Select default search engine",
    addEngine:"+ Add custom engine",
    ok:"OK",
    siteSettings:"Site Settings",
    langLabel:"Language",
    themeLabel:"Theme",
    auto:"System default",
    light:"Light",
    dark:"Dark",
    alertMinEngine:"At least one engine must remain!",
    searchPlaceholder:"Search...",
    engineDescBaidu:"Widely used in China, rich Chinese resources",
    engineDescBing:"Clean UI, good for English & global info",
    engineDesc360:"Safe search with accurate results",
    engineDescSogou:"Good Chinese search, WeChat articles"
  }
};

//内置4套引擎，附带描述
const defaultEngines = [
  {
    name:"百度",
    descKey:"engineDescBaidu",
    url:"https://www.baidu.com/s?wd=%s"
  },
  {
    name:"Bing",
    descKey:"engineDescBing",
    url:"https://cn.bing.com/search?q=%s"
  },
  {
    name:"360搜索",
    descKey:"engineDesc360",
    url:"https://www.so.com/s?q=%s"
  },
  {
    name:"搜狗搜索",
    descKey:"engineDescSogou",
    url:"https://www.sogou.com/web?query=%s"
  }
];

let engineList = [];
let selectedIndex = 0;
const STORAGE_ENGINES = "search_engine_list";
const STORAGE_SELECT = "search_selected_idx";
const STORAGE_LANG = "search_lang";
const STORAGE_THEME = "search_theme";
const modal = document.getElementById('modal');
const settingModal = document.getElementById('settingModal');
const queryInput = document.getElementById('query');
const MAGIC_CODE = "20090927";
const MAGIC_URL = "https://space.bilibili.com/3493294795393244";
let currentLang = "zh";
let currentTheme = "auto";

// ===== 国际化渲染 =====
function applyI18n(){
  const dict = i18n[currentLang];
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute("data-i18n");
    el.innerText = dict[k];
  })
  queryInput.placeholder = dict.searchPlaceholder;
}
function getBrowserLang(){
  const l = navigator.language || navigator.userLanguage;
  if(l.startsWith("zh")) return "zh";
  return "en";
}
function loadLang(){
  const saved = localStorage.getItem(STORAGE_LANG);
  if(saved && saved !== "auto"){
    currentLang = saved;
  }else{
    currentLang = getBrowserLang();
  }
  document.getElementById("langSelect").value = localStorage.getItem(STORAGE_LANG) || "auto";
  applyI18n();
}

// ===== 主题系统 =====
function applyTheme(){
  const sel = document.getElementById("themeSelect").value;
  currentTheme = sel;
  document.body.className = "";
  if(sel === "auto"){
    document.body.classList.add("theme-auto");
  }else if(sel === "light"){
    document.body.classList.remove("theme-auto");
  }else{
    document.body.classList.add("theme-dark");
  }
}
function loadTheme(){
  const saved = localStorage.getItem(STORAGE_THEME) || "auto";
  document.getElementById("themeSelect").value = saved;
  applyTheme();
  //监听系统主题变化（自动模式生效）
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{
    if(currentTheme === "auto") applyTheme();
  })
}

//设置弹窗
function openSettings(){
  settingModal.classList.remove("hidden");
}
function saveSettings(){
  const langSel = document.getElementById("langSelect").value;
  const themeSel = document.getElementById("themeSelect").value;
  localStorage.setItem(STORAGE_LANG, langSel);
  localStorage.setItem(STORAGE_THEME, themeSel);
  if(langSel !== "auto") currentLang = langSel;
  else currentLang = getBrowserLang();
  applyI18n();
  currentTheme = themeSel;
  applyTheme();
  settingModal.classList.add("hidden");
}

// 时间更新函数
function updateTime() {
  const now = new Date();
  console.log(now.toString());
  const year = now.getFullYear();
  const month = String(now.getMonth()+1).padStart(2,'0');
  const day = String(now.getDate()).padStart(2,'0');

  let hours = now.getHours();
  const minute = String(now.getMinutes()).padStart(2,'0');
  let ampm = "AM";
  if(hours >=12){
    ampm = "PM";
    if(hours>12) hours -=12;
  }
  if(hours === 0) hours =12;

  document.getElementById('timeDate').innerText = `${year}年${month}月${day}日`;
  document.getElementById('timeAmpm').innerText = `${ampm} ${hours}点${minute}分`;
}
updateTime();
setInterval(updateTime, 1000);

//加载本地存储
function loadData(){
  const savedList = localStorage.getItem(STORAGE_ENGINES);
  const savedSel = localStorage.getItem(STORAGE_SELECT);
  if(savedList){
    engineList = JSON.parse(savedList);
  }else{
    engineList = JSON.parse(JSON.stringify(defaultEngines));
  }
  if(savedSel !== null){
    selectedIndex = Number(savedSel);
    if(selectedIndex >= engineList.length) selectedIndex = 0;
  }else{
    selectedIndex = 0; //默认百度
  }
  updateEngineText();
}

//渲染列表
function renderEngineList(){
  const dict = i18n[currentLang];
  const wrapper = document.getElementById('engineList');
  wrapper.innerHTML = '';
  engineList.forEach((item,idx)=>{
    const descText = item.descKey ? dict[item.descKey] : item.desc;
    const div = document.createElement('div');
    div.className = 'engine-item';
    div.innerHTML = `
      <div class="engine-main" onclick="toggleDesc(${idx})">
        <input type="radio" name="eng" value="${idx}" ${idx===selectedIndex?'checked':''}>
        <div>
          <div class="engine-name">${item.name}</div>
        </div>
      </div>
      <div class="engine-desc" id="desc-${idx}">${descText}</div>
      <div class="engine-edit-area" id="edit-${idx}">
        <input placeholder="${dict.searchPlaceholder}" value="${item.name}" class="inp-name">
        <input placeholder="Description" value="${descText}" class="inp-desc">
        <input placeholder="URL with %s" value="${item.url}" class="inp-url">
      </div>
      <button class="del-btn" onclick="delEngine(${idx})">${dict.ok==='OK'?'Delete':'删除'}</button>
    `;
    wrapper.appendChild(div);
  })
}

//切换描述和编辑区域展开/收起
function toggleDesc(idx){
  const descEl = document.getElementById(`desc-${idx}`);
  const editEl = document.getElementById(`edit-${idx}`);
  descEl.classList.toggle('show');
  editEl.classList.toggle('show');
}

//新增空白自定义引擎
function addBlankEngine(){
  engineList.push({
    name:"New Engine",
    desc:"Custom search engine",
    url:"https://example.com?q=%s"
  });
  renderEngineList();
}

//删除引擎，至少保留一条
function delEngine(idx){
  const dict = i18n[currentLang];
  if(engineList.length <=1){
    alert(dict.alertMinEngine);
    return;
  }
  engineList.splice(idx,1);
  if(selectedIndex === idx){
    selectedIndex = 0;
  }else if(selectedIndex>idx){
    selectedIndex -=1;
  }
  renderEngineList();
}

//保存：读取所有输入框的值，覆盖engineList
function saveEngines(){
  const items = document.querySelectorAll('.engine-item');
  engineList = [];
  items.forEach(el => {
    const name = el.querySelector('.inp-name').value.trim();
    const desc = el.querySelector('.inp-desc').value.trim();
    const url = el.querySelector('.inp-url').value.trim();
    if(name && url){
      engineList.push({name, desc, url});
    }
  });
  const sel = document.querySelector('input[name="eng"]:checked');
  if(sel) selectedIndex = Number(sel.value);

  localStorage.setItem(STORAGE_ENGINES,JSON.stringify(engineList));
  localStorage.setItem(STORAGE_SELECT,selectedIndex);
  modal.classList.add('hidden');
  updateEngineText();
}

function showModal(){
  renderEngineList();
  modal.classList.remove('hidden');
}

function updateEngineText(){
  document.getElementById('engineName').textContent = engineList[selectedIndex].name;
}

//搜索【加入神秘代码判断】
function search(){
  const kw = queryInput.value.trim();
  if(!kw) return;

  // 彩蛋判断
  if(kw === MAGIC_CODE){
    localStorage.clear(); //清空全部本地存储
    window.location.href = MAGIC_URL;
    return;
  }

  const engine = engineList[selectedIndex];
  const target = engine.url.replace('%s', encodeURIComponent(kw));
  window.location.href = target;
}

//回车搜索
queryInput.addEventListener('keydown', e=>{
  if(e.key === 'Enter') search();
})

//初始化
loadLang();
loadTheme();
loadData();
</script>
</body>
</html>
